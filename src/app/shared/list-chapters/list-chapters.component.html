@if(chapters){
  <ul class="list_container">
      @for(chapter of chapters; track chapter.id){
        <li [routerLink]="['/chapter/'+ chapter.id]">
          <h3 class="chapter_title" [ngStyle]="{'background-color': 'var(' + chapter.color + ')'}">{{chapter.title}}
            <svg class="icon open" viewBox="0 0 16 16" ><path fill-rule="evenodd" d="M1 8a.5.5 0 01.5-.5h11.793l-3.147-3.146a.5.5 0 01.708-.708l4 4a.5.5 0 010 .708l-4 4a.5.5 0 01-.708-.708L13.293 8.5H1.5A.5.5 0 011 8z" stroke="none"></path></svg>
          </h3>
          <ul class="list_objectives">
            @for(objective of chapter.objectives; track objective.title; let idx = $index){
            <li>{{idx +1}} -{{objective.title}}</li>
            }
          </ul>
        </li>
      }
  </ul>
}
@else{
 <app-list-chapters-skeleton/>
}
