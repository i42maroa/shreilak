<div class="container">
  <app-title [index]="index" [text]="objective.title"/>
  <section class="objetive_content">
    <p>{{objective.description}}</p>
    <ul class="resource_container">
       @for (activity of objective.activities; track activity.id) {
        <li>
          <a class="ressource" [routerLink]="[getRouter(activity)]">
            <svg class="icon" viewBox="0 0 16 16" ><path fill-rule="evenodd" d="M1 8a.5.5 0 01.5-.5h11.793l-3.147-3.146a.5.5 0 01.708-.708l4 4a.5.5 0 010 .708l-4 4a.5.5 0 01-.708-.708L13.293 8.5H1.5A.5.5 0 011 8z" stroke="none"></path></svg>
            <span>{{activity.title}}</span>
          </a>
        </li>
      }
    </ul>
  </section>
</div>
