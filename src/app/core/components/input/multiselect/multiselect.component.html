<button class="multiselect" type="button" (click)="toggleDropdown()" tabindex="0">
  <div class="selected">
    @if (selectedOptions.length > 0) {
      @for (option of selectedOptions; track option) {
        <button type="button" class="tag" (click)="toggleOption(option, $event)">
          <span class="tagOption">{{ option }}</span>
        </button>
      }
    } @else {
      <span class="placeholder">{{placeHolder}}</span>
    }
  </div>
</button>

@if (dropdownOpen) {
  <div class="options">
    @for (option of options; track option) {
      <button
        type="button"
        class="option"
        [class.selected]="isSelected(option)"
        (click)="toggleOption(option, $event)"
      >
        {{ option }}
      </button>
    }
  </div>
}
